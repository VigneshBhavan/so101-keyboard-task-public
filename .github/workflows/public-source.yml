name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check public source boundary
        run: python3 scripts/check_public_release.py
      - name: Check Python syntax
        run: python3 -m compileall -q scripts source
